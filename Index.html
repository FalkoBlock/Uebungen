<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Übungen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Übungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --ink: #000000; --muted: #8E8E93; --soft: #B5B5BA; --line: #EDEDEF;
    --box: #C7C7CC; --accent: #2F6FEB; --on-accent: #FFFFFF; --press: #F4F5F7;
    --font: "Inter Tight", -apple-system, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1C1E; --ink: #FFFFFF; --muted: #8E8E93; --soft: #5E5E63; --line: #2C2C2E;
      --box: #545458; --accent: #5B92FF; --on-accent: #0B1A33; --press: #262628;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1C1E; --ink: #FFFFFF; --muted: #8E8E93; --soft: #5E5E63; --line: #2C2C2E;
    --box: #545458; --accent: #5B92FF; --on-accent: #0B1A33; --press: #262628;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
         font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased;
         -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Liste ---------- */
  .wrap { max-width: 620px; margin: 0 auto; padding: 28px 22px 120px; }
  .seg { display: inline-flex; padding: 3px; margin-bottom: 26px; border-radius: 999px; background: var(--press); }
  .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-size: 15px;
                font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  header { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; margin-bottom: 8px; }
  .pie { width: 26px; height: 26px; color: var(--accent); }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; }
  .meta { grid-column: 2; color: var(--muted); font-size: 15px; }

  h2.plain { margin-top: 18px; padding: 0; }
  h2 { margin: 30px 0 4px; padding-bottom: 7px; font-size: 15px; font-weight: 600; color: var(--accent);
       border-bottom: 1px solid var(--line); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 4px; border-radius: 10px; }

  .check { flex: none; width: 40px; height: 52px; display: grid; place-items: center;
           background: none; border: 0; padding: 0; cursor: pointer; }
  .check span { width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--box);
                display: grid; place-items: center; transition: background .18s, border-color .18s; }
  .check svg { width: 12px; height: 12px; opacity: 0; transform: scale(.4); transition: opacity .18s, transform .22s; }
  .done .check span { background: var(--accent); border-color: var(--accent); }
  .done .check svg { opacity: 1; transform: none; }

  .row { flex: 1; min-width: 0; display: grid; grid-template-columns: 56px 1fr auto; gap: 0 14px;
         align-items: center; text-align: left; background: none; border: 0; border-radius: 10px;
         padding: 10px 8px 10px 0; cursor: pointer; }
  .row:active { background: var(--press); }
  .fig { width: 56px; height: 35px; color: var(--ink); }
  .txt { min-width: 0; }
  .name { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .desc { display: block; color: var(--muted); font-size: 14px; line-height: 1.35;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dur { align-self: start; padding-top: 3px; color: var(--muted); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .done .name, .done .fig { color: var(--soft); }
  .done .desc, .done .dur { color: var(--soft); }

  .fig polyline { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .fig .l { stroke-width: 4.4; }
  .fig .t { stroke-width: 6.6; }
  .fig .w { stroke-width: 1.4; opacity: .45; }
  .fig circle { fill: currentColor; }

  .next { position: fixed; right: max(22px, calc(50% - 288px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
          z-index: 5; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px 0 18px;
          border-radius: 28px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer;
          font-weight: 600; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .next svg { width: 18px; height: 18px; fill: currentColor; }
  .next[hidden] { display: none; }

  /* ---------- Timer ---------- */
  .timer { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; flex-direction: column;
           padding: 0 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .timer.open { display: flex; }
  .progress { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; background: var(--line); }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .1s linear; }
  .timer.rest .progress i { background: var(--accent); }
  .t-top { padding-top: calc(28px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between;
           color: var(--muted); font-size: 15px; font-weight: 500; }
  .t-phase { color: var(--accent); font-weight: 600; }
  .t-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; max-width: 560px;
            width: 100%; margin: 0 auto; }
  .t-main .fig { width: 144px; height: 90px; margin-bottom: 18px; }
  .t-main h3 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
  .t-main p { margin: 0; color: var(--muted); font-size: 17px; max-width: 32ch; }
  .time { margin-top: 26px; font-size: clamp(96px, 31vw, 168px); font-weight: 600; line-height: .9;
          letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .timer.paused .time { color: var(--soft); }
  .timer.rest .time { color: var(--accent); }
  .actions { display: flex; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
  .btn { flex: 1; height: 54px; border-radius: 27px; font-weight: 600; font-size: 17px; cursor: pointer; }
  .primary { background: var(--ink); color: var(--bg); border: 0; }
  .secondary { background: none; color: var(--ink); border: 1.5px solid var(--line); }
  .status { max-width: 560px; width: 100%; margin: 14px auto 0; font-size: 13px; color: var(--muted); min-height: 1.3em; }

  @media (prefers-reduced-motion: reduce) { .progress i, .check span, .check svg { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <nav class="seg" id="seg" aria-label="Block wählen"></nav>
  <header>
    <svg class="pie" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle id="pieFill" cx="13" cy="13" r="4.75" fill="none" stroke="currentColor" stroke-width="9.5"
              transform="rotate(-90 13 13)" stroke-dasharray="0 30"/>
    </svg>
    <h1 id="title">Übungen</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div id="sections"></div>
</main>

<button class="next" id="nextBtn" type="button">
  <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3.2v11.6c0 .8.9 1.3 1.6.8l8.7-5.8c.6-.4.6-1.2 0-1.6L6.6 2.4C5.9 1.9 5 2.4 5 3.2z"/></svg>
  <span id="nextLabel"></span>
</button>

<section class="timer" id="timer" aria-live="polite">
  <div class="progress"><i id="bar"></i></div>
  <div class="t-top"><span id="tSection"></span><span class="t-phase" id="tPhase"></span></div>
  <div class="t-main">
    <svg class="fig" id="tFig" viewBox="0 0 80 50" aria-hidden="true"></svg>
    <h3 id="tName"></h3>
    <p id="tDesc"></p>
    <div class="time" id="tTime">0:00</div>
  </div>
  <div class="actions">
    <button class="btn secondary" id="stopBtn" type="button">Abbrechen</button>
    <button class="btn primary" id="pauseBtn" type="button">Pause</button>
  </div>
  <div class="status" id="status"></div>
</section>

<script>
(function () {
  // ---------- Piktogramme: Raster, Winkel 0/45/90° (wo nötig 2:1), Kopf frei stehend ----------
  var P = {
    katzekuh:   { h:[12,30], t:"20,26 32,14 44,26", l:["20,27 20,44", "44,27 44,44 58,44"] },
    sonnengruss:{ h:[40,9],  t:"40,20 40,31", l:["32,3 32,17 48,17 48,3", "37.6,32 37.6,45", "42.4,32 42.4,45"] },
    unterarm:   { h:[11,28], t:"18,32 42,32", l:["18,33 18,44 9,44", "42,32 66,44 72,44"] },
    seitstuetz: { h:[11,21], t:"19,26 43,38", l:["18,25 18,44", "18,22 18,4", "43,38 55,44 71,44"] },
    vogelhund:  { h:[15,32], t:"24,26 52,26", l:["22,25 6,17", "24,27 24,44", "52,27 52,44 64,44", "54,26 76,26"] },
    boot:       { h:[18,21], t:"36,40 25,29", l:["36,40 54,22", "30,33 39,33"] },
    bruecke:    { h:[8,39],  t:"15,42 38,30", l:["38,30 54,30 54,44", "15,44 32,44"] },
    stuhl:      { h:[32,13], t:"30,32 40,22", l:["40,22 52,10", "30,32 44,32 44,44"] },
    krieger2:   { h:[40,8],  t:"40,15 40,28", l:["16,17 64,17", "40,30 26,44", "40,30 54,30 54,44"] },
    ausfall:    { h:[40,9],  t:"40,20 40,30", l:["32,3 32,17 48,17 48,3", "40,31 54,31 54,44", "40,31 28,43 8,43"] },
    taube:      { h:[34,9],  t:"34,17 34,33", l:["34,19 42,27 42,38", "34,35 42,43 56,43", "34,35 26,43 4,43"] },
    hund:       { h:[27,43], t:"12,44 28,28", l:["28,28 40,16", "40,16 68,44"] },
    vorbeuge:   { h:[56,28], t:"28,42 48,32", l:["30,44 72,44", "46,37 68,41"] },
    faden:      { h:[21,35], t:"54,26 30,38", l:["54,26 54,44 70,44", "32,36 32,12", "30,44 6,44"] },
    drehung:    { h:[8,39],  t:"15,42 40,42", l:["17,40 25,32", "40,42 50,32 60,42"] },
    kind:       { h:[33,40], t:"62,34 42,44", l:["62,34 52,44 70,44", "26,44 6,44"] },
    wade:       { h:[22,9], t:"27,19 40,32", l:["26,19 12,19", "40,33 32,41 32,44", "40,33 62,44"], w:"9,4 9,44" },
    quad:       { h:[36,7],  t:"36,15 36,29", l:["33,31 33,44", "39,31 39,41 48,32", "37,17 48,28", "35,17 24,17"] },
    leiste:     { h:[28,10], t:"28,18 28,36", l:["29,39 41,33 53,39", "30,21 37,28"] },
    hinten:     { h:[24,6],  t:"44,26 30,12", l:["44,27 26,44 22,40", "45,28 51,34 51,44", "31,14 31,34"] },
    adduktoren: { h:[26,8],  t:"26,16 26,30", l:["25,32 15,42 15,44", "28,32 52,44", "24,18 17,25"] }
  };
  function svgFig(d) {
    return '<circle cx="' + d.h[0] + '" cy="' + d.h[1] + '" r="4.3"/>' +
           '<polyline class="t" points="' + d.t + '"/>' +
           d.l.map(function (pts) { return '<polyline class="l" points="' + pts + '"/>'; }).join("") +
           (d.w ? '<polyline class="w" points="' + d.w + '"/>' : "");
  }
  var F = {};
  Object.keys(P).forEach(function (k) { F[k] = svgFig(P[k]); });

  // ---------- Blöcke → Abschnitte → Übungen (sec = Dauer je Satz, sets = Anzahl / Seiten) ----------
  var BLOCKS = [
    { id: "taeglich", tab: "Täglich", title: "Tägliches Training", sections: [
      { title: "Aufwärmen", items: [
        { name: "Katze-Kuh", desc: "Vierfüßlerstand. Ausatmen: Rücken rund. Einatmen: Hohlkreuz.", sec: 60, sets: 1, fig: "katzekuh" },
        { name: "Sonnengruß A", desc: "Eine Bewegung, ein Atemzug. Zwei bis drei Runden.", sec: 120, sets: 1, fig: "sonnengruss" } ]},
      { title: "Kraft", items: [
        { name: "Unterarmstütz", desc: "Körper in einer Linie. Bauch und Gesäß fest.", sec: 40, sets: 1, fig: "unterarm" },
        { name: "Seitstütz", desc: "Hüfte hoch. Füße übereinander. Arm senkrecht.", sec: 40, sets: 2, fig: "seitstuetz" },
        { name: "Vogel-Hund", desc: "Arm und Gegenbein strecken. Becken ruhig.", sec: 40, sets: 1, fig: "vogelhund" },
        { name: "Boot", desc: "Auf dem Gesäß. Beine hoch. Rücken gerade.", sec: 40, sets: 1, fig: "boot" },
        { name: "Brücke", desc: "Becken heben. Oben halten. Langsam senken.", sec: 40, sets: 1, fig: "bruecke" },
        { name: "Stuhlhaltung", desc: "Tief sitzen. Gewicht auf den Fersen. Arme hoch.", sec: 40, sets: 1, fig: "stuhl" },
        { name: "Krieger II", desc: "Knie über dem Knöchel. Arme waagerecht.", sec: 40, sets: 2, fig: "krieger2" } ]},
      { title: "Beweglichkeit", items: [
        { name: "Tiefer Ausfallschritt", desc: "Hinteres Knie ab. Becken nach vorn unten.", sec: 60, sets: 2, fig: "ausfall" },
        { name: "Taube", desc: "Vorderes Bein quer, hinteres lang. Aufrecht.", sec: 60, sets: 2, fig: "taube" },
        { name: "Herabschauender Hund", desc: "Gesäß hoch. Fersen zum Boden. Rücken lang.", sec: 45, sets: 1, fig: "hund" },
        { name: "Vorbeuge im Sitzen", desc: "Aus der Hüfte kippen. Rücken gerade.", sec: 45, sets: 1, fig: "vorbeuge" },
        { name: "Faden einfädeln", desc: "Arm unter dem Körper durch. Schulter ab.", sec: 45, sets: 2, fig: "faden" },
        { name: "Liegende Drehung", desc: "Knie zur Seite. Schultern bleiben unten.", sec: 45, sets: 2, fig: "drehung" } ]},
      { title: "Abschluss", items: [
        { name: "Kindhaltung", desc: "Stirn zum Boden. Arme lang. Ruhig atmen.", sec: 90, sets: 1, fig: "kind" } ]}
    ]},
    { id: "laufen", tab: "Nach dem Laufen", title: "Dehnen nach dem Laufen", sections: [
      { title: "", items: [
        { name: "Waden", desc: "Hände an die Wand. Hinteres Bein gestreckt, Ferse bleibt am Boden.", sec: 30, sets: 2, fig: "wade" },
        { name: "Oberschenkel vorne", desc: "Ferse zum Gesäß ziehen. Knie zeigt nach unten, Becken leicht vor.", sec: 30, sets: 2, fig: "quad" },
        { name: "Leiste", desc: "Sitzen, Fußsohlen aneinander. Knie sinken lassen, Rücken lang.", sec: 45, sets: 1, fig: "leiste" },
        { name: "Oberschenkel hinten", desc: "Bein gestreckt vor, Fußspitze hoch. Mit geradem Rücken aus der Hüfte kippen.", sec: 30, sets: 2, fig: "hinten" },
        { name: "Oberschenkel innen", desc: "Breiter Stand. Gewicht auf ein Bein verlagern, das andere bleibt gestreckt.", sec: 30, sets: 2, fig: "adduktoren" } ]}
    ]}
  ];
  var SWITCH_SEC = 5;   // Pause zum Seitenwechsel zwischen zwei Sätzen

  function fmt(t) { var s = Math.ceil(Math.max(0, t)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function durLabel(ex) { return (ex.sets > 1 ? ex.sets + " \u00d7 " : "") + fmt(ex.sec); }

  BLOCKS.forEach(function (b) {
    b.all = []; b.total = 0;
    b.sections.forEach(function (s) { s.items.forEach(function (ex) {
      ex.key = b.id + "-" + (b.all.length + 1); ex.section = s.title || b.title;
      b.all.push(ex); b.total += ex.sec * ex.sets + (ex.sets - 1) * SWITCH_SEC; }); });
  });

  // ---------- Heute erledigt ----------
  var todayKey = "erledigt2-" + new Date().toISOString().slice(0, 10);
  var done = {};
  try { done = JSON.parse(localStorage.getItem(todayKey) || "{}") || {}; } catch (e) {}
  function persist() { try { localStorage.setItem(todayKey, JSON.stringify(done)); } catch (e) {} }

  var active = 0;
  try { var saved = localStorage.getItem("block"); BLOCKS.forEach(function (b, i) { if (b.id === saved) active = i; }); } catch (e) {}

  var CHECK = '<svg viewBox="0 0 12 12" aria-hidden="true"><polyline points="2.2,6.3 4.9,8.9 9.8,3.4" fill="none" stroke="var(--on-accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- Umschalter ----------
  var seg = document.getElementById("seg");
  BLOCKS.forEach(function (b, i) {
    var t = document.createElement("button"); t.type = "button"; t.textContent = b.tab;
    t.addEventListener("click", function () {
      active = i; try { localStorage.setItem("block", b.id); } catch (e) {}
      render(); window.scrollTo(0, 0);
    });
    seg.appendChild(t);
  });

  // ---------- Liste ----------
  var root = document.getElementById("sections");
  function render() {
    var B = BLOCKS[active];
    [].forEach.call(seg.children, function (t, i) { t.setAttribute("aria-pressed", i === active ? "true" : "false"); });
    document.getElementById("title").textContent = B.title;
    document.title = B.title;
    root.textContent = "";
    B.sections.forEach(function (s) {
      var h = document.createElement("h2"); h.textContent = s.title;
      if (!s.title) h.className = "plain";
      root.appendChild(h);
      var ul = document.createElement("ul");
      s.items.forEach(function (ex) {
        var li = document.createElement("li");
        if (done[ex.key]) li.className = "done";

        var c = document.createElement("button");
        c.type = "button"; c.className = "check";
        c.setAttribute("aria-label", ex.name + (done[ex.key] ? " als offen markieren" : " als erledigt markieren"));
        c.innerHTML = "<span>" + CHECK + "</span>";
        c.addEventListener("click", function () {
          if (done[ex.key]) delete done[ex.key]; else done[ex.key] = true;
          persist(); render();
        });

        var b = document.createElement("button"); b.type = "button"; b.className = "row";
        b.innerHTML = '<svg class="fig" viewBox="0 0 80 50" aria-hidden="true">' + F[ex.fig] +
          '</svg><span class="txt"><span class="name"></span><span class="desc"></span></span><span class="dur"></span>';
        b.querySelector(".name").textContent = ex.name;
        b.querySelector(".desc").textContent = ex.desc;
        b.querySelector(".dur").textContent = durLabel(ex);
        b.addEventListener("click", function () { start(ex); });

        li.append(c, b); ul.appendChild(li);
      });
      root.appendChild(ul);
    });
    var n = B.all.filter(function (ex) { return done[ex.key]; }).length;
    document.getElementById("meta").textContent = n
      ? n + " von " + B.all.length + " erledigt"
      : B.all.length + " Übungen, " + Math.round(B.total / 60) + " Minuten";
    document.getElementById("pieFill").setAttribute("stroke-dasharray", (n / B.all.length * 29.85) + " 30");
    var next = B.all.find(function (ex) { return !done[ex.key]; });
    var nb = document.getElementById("nextBtn");
    nb.hidden = !next;
    if (next) { document.getElementById("nextLabel").textContent = next.name; nb.onclick = function () { start(next); }; }
  }

  // ---------- Display wach halten ----------
  var wakeLock = null, statusEl = document.getElementById("status");
  async function keepAwake() {
    if (!("wakeLock" in navigator)) { statusEl.textContent = "Display-Sperre kann hier nicht verhindert werden."; return; }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      statusEl.textContent = "Display bleibt an";
      wakeLock.addEventListener("release", function () { wakeLock = null; });
    } catch (e) { statusEl.textContent = "Display-Sperre konnte nicht verhindert werden."; }
  }
  function allowSleep() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && current) keepAwake();
  });

  // ---------- Töne ----------
  var ctx = null;
  function primeAudio() {
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
  }
  function beep(count, freq) {
    if (!ctx) return;
    for (var i = 0; i < count; i++) {
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.25;
      o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.start(t); o.stop(t + 0.22);
    }
  }

  // ---------- Timer mit Phasen (Satz, Wechsel, Satz …) ----------
  var timerEl = document.getElementById("timer"), bar = document.getElementById("bar"),
      tTime = document.getElementById("tTime"), tPhase = document.getElementById("tPhase"),
      pauseBtn = document.getElementById("pauseBtn");

  var current = null, phases = [], pi = 0, endTime = 0, remaining = 0, paused = false, tick = null;

  function buildPhases(ex) {
    var p = [];
    for (var i = 1; i <= ex.sets; i++) {
      p.push({ len: ex.sec, label: ex.sets > 1 ? "Satz " + i + " von " + ex.sets : "" });
      if (i < ex.sets) p.push({ len: SWITCH_SEC, label: "Seite wechseln", rest: true });
    }
    return p;
  }
  function enterPhase(i) {
    pi = i; remaining = phases[i].len; endTime = Date.now() + remaining * 1000;
    tPhase.textContent = phases[i].label;
    timerEl.classList.toggle("rest", !!phases[i].rest);
    draw();
  }
  function draw() {
    tTime.textContent = fmt(remaining);
    bar.style.width = ((1 - remaining / phases[pi].len) * 100) + "%";
  }
  function start(ex) {
    primeAudio();
    current = ex; phases = buildPhases(ex); paused = false;
    document.getElementById("tFig").innerHTML = F[ex.fig];
    document.getElementById("tName").textContent = ex.name;
    document.getElementById("tDesc").textContent = ex.desc;
    document.getElementById("tSection").textContent = ex.section;
    pauseBtn.textContent = "Pause"; timerEl.classList.remove("paused"); timerEl.classList.add("open");
    enterPhase(0);
    keepAwake();
    tick = setInterval(function () {
      if (paused) return;
      remaining = Math.max(0, (endTime - Date.now()) / 1000);
      draw();
      if (remaining <= 0) {
        if (pi + 1 < phases.length) { beep(1, 660); enterPhase(pi + 1); }
        else finish();
      }
    }, 100);
  }
  function close() {
    clearInterval(tick); tick = null; current = null;
    allowSleep(); statusEl.textContent = "";
    timerEl.classList.remove("open", "rest");
    render();
  }
  function finish() {
    clearInterval(tick); tick = null;
    beep(2, 880);
    done[current.key] = true; persist();
    tPhase.textContent = ""; tTime.textContent = "Fertig";
    setTimeout(close, 1200);
  }
  pauseBtn.addEventListener("click", function () {
    if (!current || !tick) return;
    if (paused) endTime = Date.now() + remaining * 1000;
    paused = !paused;
    pauseBtn.textContent = paused ? "Weiter" : "Pause";
    timerEl.classList.toggle("paused", paused);
  });
  document.getElementById("stopBtn").addEventListener("click", close);

  render();
})();
</script>
</body>
</html>
